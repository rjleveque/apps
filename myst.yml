version: 1
project:
  title: clawpack-apps
  authors:
    - name: Clawpack Development Team
  copyright: '2026'
  github: clawpack/apps
  bibliography:
    - docs/references.bib
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/clawpack-apps.pdf
  toc:
    - file: docs/index.md
    - title: Overview and introduction
      children:
        - file: docs/intro.md
    - title: Jupyter notebooks
      children:
        - file: docs/notebooks.md
    - title: visclaw notebooks
      children:
        - file: notebooks/visclaw/animation_tools_demo.ipynb
        - file: notebooks/visclaw/gridtools.ipynb
        - file: notebooks/visclaw/pcolorcells.ipynb
    - title: amrclaw notebooks
      children:
        - file: notebooks/amrclaw/RuledRectangles.ipynb
    - title: geoclaw notebooks
      children:
        - file: notebooks/geoclaw/topotools_examples.ipynb
    - title: Resources
      children:
        - file: docs/biblio.md
site:
  options:
    logo: images/clawlogo.jpg
    favicon: images/clawicon.ico
    folders: true
  template: book-theme
